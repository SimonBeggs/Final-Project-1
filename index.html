<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script
      src="https://kit.fontawesome.com/6b877e9745.js"
      crossorigin="anonymous"
    ></script>
    <script src="index.js"></script>
  </head>
  <body>
    <section id="landing">
      <nav>
        <div class="row nav__row">
          <div class="nav__logo">
            <img class="nav__logo--img" src="assets/t-img.svg" alt="Logo" />
            <div class="nav__logo--title">Treact</div>
          </div>

          <div class="nav__links">
            <a href="#" class="nav__link" onclick="closeMenu()">About</a>
            <a href="#" class="nav__link" onclick="closeMenu()">Blog</a>
            <a href="#pricing" class="nav__link" onclick="closeMenu()"
              >Pricing</a
            >
            <a href="#" class="nav__link" onclick="closeMenu()">Contact Us</a>
            <a href="#" class="nav__link login" onclick="closeMenu()">Login</a>
            <a
              href="#"
              class="nav__link nav__link--primary"
              onclick="closeMenu()"
              >Sign Up</a
            >
          </div>

          <button class="btn__menu" onclick="openMenu()">
            <i class="fas fa-bars"></i>
          </button>
          <div class="menu__backdrop">
            <button class="btn__menu btn__menu--close" onclick="closeMenu()">
              <i class="fas fa-times"></i>
            </button>
            <div class="menu__links">
              <a href="#" class="menu__link" onclick="closeMenu()">About</a>
              <a href="#" class="menu__link" onclick="closeMenu()">Blog</a>
              <a href="#pricing" class="menu__link" onclick="closeMenu()"
                >Pricing</a
              >
              <a href="#" class="menu__link" onclick="closeMenu()"
                >Contact Us</a
              >
              <a href="#" class="menu__link" onclick="closeMenu()">Login</a>
              <a
                href="#"
                class="menu__link menu__link--primary"
                onclick="closeMenu()"
                >Sign Up</a
              >
            </div>
          </div>
        </div>
      </nav>

      <header>
        <div class="container">
          <div class="row">
            <div class="header__description">
              <h1>
                Beautiful React Templates <span class="blue">for you</span>
              </h1>
              <p class="header__description--para">
                Our templates are easy to setup, understand and customize. Fully
                modular components with a variety of pages and components.
              </p>
              <div class="header__email">
                <input type="text" class="header__email--input" placeholder="Your E-mail Address"/> 
              <button class="header__email--btn">Get Started</button>
              </div>
            </div>
          </div>
        </div>
      </header>
    </section>
  </body>
</html>
